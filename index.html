<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Study log</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17142B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Study log">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#17142B; --panel:#211D3B; --panel2:#2A2549; --line:#3A3460; --ink:#F2EFFF; --soft:#9E99C8; --accent:#B5A8FF;
  --display:'Fraunces',Georgia,serif; --body:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);color-scheme:dark}
body{font-family:var(--body);font-variant-numeric:tabular-nums;min-height:100vh;
  padding:calc(20px + env(safe-area-inset-top)) 16px calc(56px + env(safe-area-inset-bottom))}
button{font-family:inherit}
.wrap{max-width:460px;margin:0 auto}

.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.head h1{font-family:var(--display);font-weight:700;font-size:28px;margin:0;letter-spacing:-.01em}
.streak{background:var(--panel2);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:500}

.card{background:var(--panel);border-radius:26px;padding:18px;margin-bottom:14px}

/* composer */
.chips{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.chips button,.datechip{border:1px solid var(--line);background:transparent;color:var(--soft);font:500 13.5px var(--body);padding:7px 14px;border-radius:999px;cursor:pointer;position:relative;display:inline-flex;align-items:center}
.chips .on,.datechip.on{background:var(--accent);border-color:var(--accent);color:#211A55}
.datechip input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--bg);border-radius:16px;padding:14px 16px;font:400 16px var(--body);color:var(--ink);outline:none}
.row input::placeholder{color:#6F6A9A}
.row input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(181,168,255,.22)}
.row button{border:0;background:var(--accent);color:#211A55;font:600 16px var(--body);padding:0 22px;border-radius:16px;cursor:pointer}
.row button:active{transform:scale(.97)}
.note{font-size:13px;color:var(--soft);margin:10px 2px 0;min-height:18px}
.note.ok{color:#6FE0BE}
.note.err{color:#FF9DBF}

/* range controls */
.seg{display:flex;background:var(--panel);border-radius:999px;padding:4px;margin:6px 0 12px}
.seg button{flex:1;border:0;background:transparent;font:500 14.5px var(--body);color:var(--soft);padding:9px 0;border-radius:999px;cursor:pointer;transition:background .2s,color .2s}
.seg button.on{background:var(--panel2);color:var(--ink)}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.nav span{font-weight:500;font-size:16px}
.nav button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:22px;line-height:1;cursor:pointer;padding:0 0 3px}
.nav button:disabled{opacity:.3;cursor:default}

/* stat tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tile{background:var(--panel);border-radius:20px;padding:14px 16px;min-width:0}
.tv{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl{color:var(--soft);font-size:13px;margin-top:3px}

/* chart */
.chart{padding:22px 20px 16px}
.donutBox{position:relative;max-width:260px;margin:0 auto}
.donut{display:block;width:100%;height:auto}
.donut circle.arc{animation:draw .7s cubic-bezier(.3,.8,.3,1)}
@keyframes draw{from{stroke-dasharray:0 999}}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.big{font-family:var(--display);font-weight:700;font-size:36px;letter-spacing:-.02em;line-height:1}
.emptyT{font-family:var(--display);font-weight:500;font-size:22px}
.sub{color:var(--soft);font-size:13.5px;margin-top:6px}

.bars{display:flex;align-items:flex-end;margin-top:22px;padding-top:6px;border-top:1px solid var(--line)}
.bars.week{gap:8px}
.bars.month{gap:2px}
.bar{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);padding:10px 0 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px}
.bar:disabled{cursor:default}
.bar .val{font-size:11.5px;color:var(--soft);height:14px}
.col{height:130px;width:100%;display:flex;align-items:flex-end}
.stack{width:100%;display:flex;flex-direction:column-reverse;gap:2px;border-radius:7px;overflow:hidden}
.month .stack{border-radius:3px;gap:1px}
.stack.zero{height:4px;background:var(--panel2)}
.bar.future .stack{opacity:.4}
.bar .lab{font-size:12px;color:var(--soft);height:15px;white-space:nowrap}
.bar.today .lab{color:var(--accent);font-weight:600}
.month .bar .lab{font-size:10.5px;overflow:visible}

/* subject table */
.table{padding:8px 18px 10px}
.thead{display:flex;justify-content:space-between;color:var(--soft);font-size:12.5px;padding:8px 0 4px}
.thead span:first-child{flex:1}
.thead span:nth-child(2){width:78px;text-align:right}
.thead span:nth-child(3){width:44px;text-align:right}
.trow{padding:12px 0}
.trow + .trow{border-top:1px solid var(--line)}
.tline{display:flex;align-items:center}
.tn{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.em{font-size:19px;width:26px;text-align:center}
.nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tt{width:78px;text-align:right;font-weight:600}
.tp{width:44px;text-align:right;color:var(--soft);font-size:14px}
.tline button{border:0;background:transparent;color:#6F6A9A;font-size:20px;line-height:1;cursor:pointer;padding:2px 2px 2px 10px}
.tline button:hover{color:#FF9DBF}
.meter{height:6px;background:var(--panel2);border-radius:99px;margin-top:9px;overflow:hidden}
.meter div{height:100%;border-radius:99px}
.meta{font-size:12.5px;color:var(--soft);margin-top:7px}
.none{color:var(--soft);font-size:14px;padding:14px 0;margin:0}

.foot{display:flex;justify-content:center;gap:18px;margin-top:22px}
.foot button{border:0;background:transparent;color:var(--soft);font:500 13px var(--body);cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:6px}

button:focus-visible,.datechip:focus-within{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <h1>Study log</h1>
    <div class="streak" id="streak" title="Days in a row with study logged"></div>
  </header>

  <section class="card">
    <div class="chips">
      <button id="chipToday" data-act="logdate" data-v="today">Today</button>
      <button id="chipYest" data-act="logdate" data-v="yest">Yesterday</button>
      <label class="datechip" id="chipDate">
        <span id="chipDateLabel">Pick date</span>
        <input type="date" id="dateInput" aria-label="Choose the date to log for">
      </label>
    </div>
    <div class="row">
      <input id="text" placeholder="1.5h maths, 2h english, 30m mock" aria-label="Log study time" enterkeyhint="done" autocomplete="off">
      <button id="add">Add</button>
    </div>
    <p class="note" id="note" aria-live="polite"></p>
  </section>

  <div id="view"></div>

  <div class="foot">
    <button id="export">Export backup</button>
    <button id="import">Import backup</button>
    <input type="file" id="file" accept="application/json,.json" hidden>
  </div>
</div>

<script>
(function () {
  "use strict";
  var STORE_KEY = "study-log-v1";

  var PALETTE = ["#A99BFF", "#FF9DBF", "#6FE0BE", "#FFD37A", "#7DBEFF", "#FFA184", "#D6A2F5", "#A8DE85"];

  var EMOJI_RULES = [
    [/mock|test|exam|paper|pyq|quiz/, "📝"],
    [/math|algebra|calcul|geometry|trigo|statistic/, "📐"],
    [/english|grammar|vocab|literature|essay|writing/, "📖"],
    [/physic/, "⚛️"],
    [/chem/, "🧪"],
    [/bio|zoology|botany/, "🧬"],
    [/science/, "🔬"],
    [/histor/, "🏛️"],
    [/geo/, "🌍"],
    [/polit|civics|polity|\blaw\b/, "⚖️"],
    [/econ|account|commerce|business/, "📈"],
    [/comput|\bcs\b|cod(e|ing)|program|dsa|python|java/, "💻"],
    [/hindi|urdu|sanskrit|french|german|spanish|language|tamil|telugu/, "🗣️"],
    [/reason|logic|aptitude|quant/, "🧠"],
    [/\bgk\b|current|news|affairs/, "📰"],
    [/revis|review|recap/, "🔁"],
    [/read|book|novel/, "📚"],
    [/art|draw|design/, "🎨"],
    [/music/, "🎵"],
    [/note/, "🗒️"]
  ];
  function emojiFor(name) {
    var n = name.toLowerCase();
    for (var i = 0; i < EMOJI_RULES.length; i++) if (EMOJI_RULES[i][0].test(n)) return EMOJI_RULES[i][1];
    return "📚";
  }

  var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  var MONTHS_LONG = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  var DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

  function pad(n) { return String(n).padStart(2, "0"); }
  function keyOf(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function dateOf(k) { var p = k.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function addDays(k, n) { var d = dateOf(k); d.setDate(d.getDate() + n); return keyOf(d); }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function $(id) { return document.getElementById(id); }

  function fmt(mins) {
    var t = Math.round(mins), h = Math.floor(t / 60), m = t % 60;
    if (h && m) return h + "h " + m + "m";
    if (h) return h + "h";
    return m + "m";
  }
  function fmtH(mins) { return (mins / 60).toFixed(1).replace(/\.0$/, "") + "h"; }

  function rangeOf(type, anchor) {
    var a = dateOf(anchor);
    if (type === "day") return [anchor];
    if (type === "week") {
      var offset = (a.getDay() + 6) % 7; // Monday start
      var start = addDays(anchor, -offset), out = [];
      for (var i = 0; i < 7; i++) out.push(addDays(start, i));
      return out;
    }
    var y = a.getFullYear(), m = a.getMonth(), count = new Date(y, m + 1, 0).getDate(), res = [];
    for (var j = 1; j <= count; j++) res.push(y + "-" + pad(m + 1) + "-" + pad(j));
    return res;
  }

  // "1.5 hour maths and 2 hr English and 30 min mock"
  function parseLog(text) {
    var chunks = text.split(/\s*(?:,|;|\+|&|\n|\band\b)\s*/i).map(function (c) { return c.trim(); }).filter(Boolean);
    var entries = [], bad = [];
    var re = /(\d+(?:\.\d+)?)\s*(hours?|hrs?|h|minutes?|mins?|m)(?![a-z])/gi;
    chunks.forEach(function (chunk) {
      var mins = 0, found = false;
      var rest = chunk.replace(re, function (_, n, u) {
        found = true;
        mins += parseFloat(n) * (u[0].toLowerCase() === "h" ? 60 : 1);
        return " ";
      });
      var name = rest.replace(/[^\p{L}\p{N}\s'&-]/gu, " ").replace(/^\s*(of|on|for)\s+/i, "").replace(/\s+/g, " ").trim();
      if (found && name && mins > 0) entries.push({ name: cap(name), mins: mins });
      else bad.push(chunk);
    });
    return { entries: entries, bad: bad };
  }

  /* ---------- state + storage ---------- */
  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        var d = JSON.parse(raw);
        if (d && d.days) return { days: d.days, colors: d.colors || {} };
      }
    } catch (e) {}
    return { days: {}, colors: {} };
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state.data)); } catch (e) {}
  }
  var now0 = keyOf(new Date());
  var state = { data: load(), today: now0, type: "day", anchor: now0, logDate: now0, note: null };

  function groupDay(k) {
    var map = {};
    (state.data.days[k] || []).forEach(function (e) {
      var id = e.name.toLowerCase();
      map[id] = map[id] || { id: id, name: e.name, mins: 0 };
      map[id].mins += e.mins;
    });
    return Object.keys(map).map(function (i) { return map[i]; }).sort(function (a, b) { return b.mins - a.mins; });
  }
  function dayTotal(k) { return (state.data.days[k] || []).reduce(function (s, e) { return s + e.mins; }, 0); }
  function colorFor(id) { var i = state.data.colors[id]; return PALETTE[(i === undefined ? 0 : i) % PALETTE.length]; }

  function dayLabel(k, long) {
    var d = dateOf(k), s = d.getDate() + " " + MONTHS[d.getMonth()];
    if (k === state.today) return "Today · " + s;
    if (k === addDays(state.today, -1)) return "Yesterday · " + s;
    return DOW[d.getDay()] + (long ? ", " : " ") + s;
  }

  /* ---------- header + composer ---------- */
  function computeStreak() {
    var n = 0, k = state.today;
    if (dayTotal(k) === 0) k = addDays(k, -1);
    while (dayTotal(k) > 0 && n < 3650) { n++; k = addDays(k, -1); }
    return n;
  }
  function renderHead() {
    var n = computeStreak();
    $("streak").textContent = "🔥 " + n + " day streak";
  }
  function renderComposer() {
    var y = addDays(state.today, -1);
    $("chipToday").className = state.logDate === state.today ? "on" : "";
    $("chipYest").className = state.logDate === y ? "on" : "";
    var custom = state.logDate !== state.today && state.logDate !== y;
    $("chipDate").className = "datechip" + (custom ? " on" : "");
    $("chipDateLabel").textContent = custom ? dayLabel(state.logDate) : "Pick date";
    $("dateInput").value = state.logDate;
    $("dateInput").max = state.today;
    var note = $("note");
    if (state.note) {
      note.className = "note " + state.note.kind;
      note.textContent = state.note.msg;
    } else {
      note.className = "note";
      note.textContent = "Logging for " + dayLabel(state.logDate) + ". Separate subjects with commas or “and”.";
    }
  }

  /* ---------- main view ---------- */
  function renderView() {
    var type = state.type, anchor = state.anchor, today = state.today;
    var keys = rangeOf(type, anchor);
    var perDay = keys.map(function (k) { return { k: k, g: groupDay(k), total: dayTotal(k) }; });

    var map = {};
    perDay.forEach(function (d) {
      d.g.forEach(function (s) {
        map[s.id] = map[s.id] || { id: s.id, name: s.name, mins: 0, days: 0 };
        map[s.id].mins += s.mins;
        map[s.id].days += 1;
      });
    });
    var subjects = Object.keys(map).map(function (i) { return map[i]; }).sort(function (a, b) { return b.mins - a.mins; });
    var total = subjects.reduce(function (s, x) { return s + x.mins; }, 0);
    var elapsed = keys.filter(function (k) { return k <= today; }).length || 1;
    var studied = perDay.filter(function (d) { return d.total > 0; }).length;
    var best = perDay.reduce(function (b, d) { return d.total > b.total ? d : b; }, { total: 0 });
    var atEnd = keys[keys.length - 1] >= today;

    var label;
    if (type === "day") label = dayLabel(anchor, true);
    else if (type === "month") { var ad = dateOf(anchor); label = MONTHS_LONG[ad.getMonth()] + " " + ad.getFullYear(); }
    else {
      var a = dateOf(keys[0]), b = dateOf(keys[6]);
      label = a.getMonth() === b.getMonth()
        ? a.getDate() + " – " + b.getDate() + " " + MONTHS[b.getMonth()]
        : a.getDate() + " " + MONTHS[a.getMonth()] + " – " + b.getDate() + " " + MONTHS[b.getMonth()];
    }

    var tiles;
    if (type === "day") {
      tiles = [
        ["Total", total ? fmt(total) : "0m"],
        ["Subjects", String(subjects.length)],
        ["Top subject", subjects[0] ? emojiFor(subjects[0].name) + " " + esc(subjects[0].name) : "—"],
        ["Share of top", subjects[0] ? Math.round((subjects[0].mins / total) * 100) + "%" : "—"]
      ];
    } else {
      var bd = best.total ? dateOf(best.k) : null;
      tiles = [
        ["Total", total ? fmt(total) : "0m"],
        ["Daily average", total ? fmt(total / elapsed) : "0m"],
        ["Best day", bd ? fmt(best.total) + " · " + bd.getDate() + " " + MONTHS[bd.getMonth()] : "—"],
        ["Days studied", studied + " of " + elapsed]
      ];
    }

    // donut
    var R = 78, C = 2 * Math.PI * R, gap = subjects.length > 1 ? 3.5 : 0, acc = 0, arcs = "";
    subjects.forEach(function (s) {
      var frac = s.mins / total, len = Math.max(frac * C - gap, 0.5), off = -(acc * C + gap / 2);
      acc += frac;
      arcs += '<circle class="arc" cx="100" cy="100" r="' + R + '" fill="none" stroke="' + colorFor(s.id) +
        '" stroke-width="24" stroke-dasharray="' + len + " " + C + '" stroke-dashoffset="' + off + '"/>';
    });
    var sub = type === "day" ? "studied" : "over the " + type;
    var center = total
      ? '<div class="big">' + fmt(total) + '</div><div class="sub">' + sub + "</div>"
      : '<div class="emptyT">Nothing yet</div><div class="sub">No time logged</div>';

    // bars
    var bars = "";
    if (type !== "day") {
      var maxBar = Math.max(60, Math.max.apply(null, perDay.map(function (d) { return d.total; })));
      bars = '<div class="bars ' + type + '">' + perDay.map(function (d) {
        var date = dateOf(d.k), future = d.k > today, lab;
        if (type === "week") lab = DOW[date.getDay()];
        else lab = (date.getDate() === 1 || date.getDate() % 5 === 0) ? String(date.getDate()) : "";
        var segs = d.g.map(function (s) { return '<div style="flex:' + s.mins + ";background:" + colorFor(s.id) + '"></div>'; }).join("");
        var h = d.total ? ' style="height:' + Math.max((d.total / maxBar) * 100, 4) + '%"' : "";
        return '<button class="bar' + (d.k === today ? " today" : "") + (future ? " future" : "") + '" data-act="bar" data-k="' + d.k +
          '" aria-label="' + esc(dayLabel(d.k, true)) + ": " + (d.total ? fmt(d.total) : "nothing logged") + '"' + (future ? " disabled" : "") + ">" +
          '<span class="val">' + (type === "week" && d.total ? fmtH(d.total) : "") + "</span>" +
          '<div class="col"><div class="stack' + (d.total ? "" : " zero") + '"' + h + ">" + segs + "</div></div>" +
          '<span class="lab">' + lab + "</span></button>";
      }).join("") + "</div>";
    }

    // table
    var rows = subjects.map(function (s) {
      var pct = Math.round((s.mins / total) * 100);
      return '<div class="trow"><div class="tline">' +
        '<span class="tn"><span class="em">' + emojiFor(s.name) + '</span><span class="nm">' + esc(s.name) + "</span></span>" +
        '<span class="tt">' + fmt(s.mins) + '</span><span class="tp">' + pct + "%</span>" +
        (type === "day" ? '<button data-act="remove" data-id="' + esc(s.id) + '" aria-label="Remove ' + esc(s.name) + ' from this day">×</button>' : "") +
        '</div><div class="meter"><div style="width:' + (s.mins / subjects[0].mins) * 100 + "%;background:" + colorFor(s.id) + '"></div></div>' +
        (type !== "day" ? '<div class="meta">' + s.days + " day" + (s.days > 1 ? "s" : "") + " · " + fmt(s.mins / s.days) + " on the days you studied it</div>" : "") +
        "</div>";
    }).join("");

    $("view").innerHTML =
      '<div class="seg" role="tablist">' +
      ["day", "week", "month"].map(function (t) {
        return '<button role="tab" aria-selected="' + (type === t) + '" class="' + (type === t ? "on" : "") + '" data-act="type" data-v="' + t + '">' + cap(t) + "</button>";
      }).join("") + "</div>" +
      '<div class="nav"><button data-act="step" data-v="-1" aria-label="Previous ' + type + '">‹</button><span>' + esc(label) +
      '</span><button data-act="step" data-v="1" aria-label="Next ' + type + '"' + (atEnd ? " disabled" : "") + ">›</button></div>" +
      '<div class="tiles">' + tiles.map(function (t) { return '<div class="tile"><div class="tv">' + t[1] + '</div><div class="tl">' + t[0] + "</div></div>"; }).join("") + "</div>" +
      '<section class="card chart"><div class="donutBox"><svg viewBox="0 0 200 200" class="donut" role="img" aria-label="Study time by subject">' +
      '<circle cx="100" cy="100" r="' + R + '" fill="none" stroke="#302B52" stroke-width="24"/><g transform="rotate(-90 100 100)">' + arcs + "</g></svg>" +
      '<div class="center">' + center + "</div></div>" + bars + "</section>" +
      '<section class="card table"><div class="thead"><span>Subject</span><span>' + (type === "day" ? "Time" : "Total") + "</span><span>Share</span></div>" +
      (subjects.length ? rows : '<p class="none">Nothing logged in this ' + type + ". Add a session above.</p>") + "</section>";
  }

  function renderAll() { renderHead(); renderComposer(); renderView(); }

  /* ---------- actions ---------- */
  function addLog() {
    var input = $("text");
    var parsed = parseLog(input.value);
    if (!parsed.entries.length) {
      state.note = { kind: "err", msg: "Add a time and a subject, like 1.5h maths or 30m mock." };
      renderComposer();
      return;
    }
    var d = state.data;
    parsed.entries.forEach(function (e) {
      var id = e.name.toLowerCase();
      if (d.colors[id] === undefined) d.colors[id] = Object.keys(d.colors).length % PALETTE.length;
    });
    var stamp = Date.now();
    var list = d.days[state.logDate] || [];
    parsed.entries.forEach(function (e, i) { list.push({ id: stamp + "-" + i, name: e.name, mins: e.mins }); });
    d.days[state.logDate] = list;
    save();
    input.value = "";
    state.anchor = state.logDate; // jump to the day you just logged
    var sum = parsed.entries.reduce(function (s, e) { return s + e.mins; }, 0);
    state.note = parsed.bad.length
      ? { kind: "err", msg: "Added " + fmt(sum) + " to " + dayLabel(state.logDate) + '. Couldn\'t read "' + parsed.bad.join('", "') + '".' }
      : { kind: "ok", msg: "Added " + fmt(sum) + " to " + dayLabel(state.logDate) + "." };
    renderAll();
  }

  function step(dir) {
    if (state.type === "day") state.anchor = addDays(state.anchor, dir);
    else if (state.type === "week") state.anchor = addDays(state.anchor, 7 * dir);
    else { var d = dateOf(state.anchor); state.anchor = keyOf(new Date(d.getFullYear(), d.getMonth() + dir, 1)); }
    renderView();
  }

  $("view").addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-act]");
    if (!el || el.disabled) return;
    var act = el.getAttribute("data-act");
    if (act === "type") { state.type = el.getAttribute("data-v"); renderView(); }
    else if (act === "step") step(Number(el.getAttribute("data-v")));
    else if (act === "bar") { state.anchor = el.getAttribute("data-k"); state.type = "day"; renderView(); }
    else if (act === "remove") {
      var id = el.getAttribute("data-id");
      var rest = (state.data.days[state.anchor] || []).filter(function (e) { return e.name.toLowerCase() !== id; });
      if (rest.length) state.data.days[state.anchor] = rest; else delete state.data.days[state.anchor];
      save();
      state.note = null;
      renderAll();
    }
  });

  document.querySelector(".chips").addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-act='logdate']");
    if (!el) return;
    state.logDate = el.getAttribute("data-v") === "today" ? state.today : addDays(state.today, -1);
    state.note = null;
    renderComposer();
  });
  $("dateInput").addEventListener("change", function (ev) {
    if (ev.target.value) { state.logDate = ev.target.value; state.note = null; renderComposer(); }
  });
  $("add").addEventListener("click", addLog);
  $("text").addEventListener("keydown", function (ev) { if (ev.key === "Enter") addLog(); });

  /* ---------- backup ---------- */
  $("export").addEventListener("click", function () {
    var blob = new Blob([JSON.stringify(state.data, null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "study-log-backup-" + state.today + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  });
  $("import").addEventListener("click", function () { $("file").click(); });
  $("file").addEventListener("change", function (ev) {
    var f = ev.target.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var d = JSON.parse(r.result);
        if (!d || typeof d.days !== "object") throw new Error("bad");
        if (confirm("Replace the current log with this backup?")) {
          state.data = { days: d.days, colors: d.colors || {} };
          save();
          state.note = { kind: "ok", msg: "Backup imported." };
          renderAll();
        }
      } catch (e) {
        state.note = { kind: "err", msg: "That file isn't a Study log backup." };
        renderComposer();
      }
    };
    r.readAsText(f);
    ev.target.value = "";
  });

  /* ---------- new day starts fresh ---------- */
  function checkDay() {
    var n = keyOf(new Date());
    if (n !== state.today) {
      var prev = state.today;
      state.today = n;
      if (state.anchor === prev) state.anchor = n;
      if (state.logDate === prev) state.logDate = n;
      renderAll();
    }
  }
  setInterval(checkDay, 30000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) checkDay(); });

  /* ---------- go ---------- */
  renderAll();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }
})();
</script>
</body>
</html>
